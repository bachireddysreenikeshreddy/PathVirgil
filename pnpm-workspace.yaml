# Standalone Harbor project dependency configuration.
minimumReleaseAge: 10080
minimumReleaseAgeIgnoreMissingTime: false
trustLockfile: false
strictDepBuilds: true
allowBuilds:
  esbuild: true
  fsevents: true
  onnxruntime-node: false
  protobufjs: false
  sharp: true
  unrs-resolver: true
  workerd: true
storeDir: ${HARBOR_PNPM_SHARED_STORE:-.harbor-runtime/pnpm-store}
cacheDir: ${HARBOR_PNPM_SHARED_STORE:-.harbor-runtime/pnpm-store}/policy-cache
enableGlobalVirtualStore: false
# Reuse store files with clones or hardlinks before falling back to copies.
packageImportMethod: auto
# The explicit installer owns dependency setup, including restored workspaces.
verifyDepsBeforeRun: false
optimisticRepeatInstall: false
overrides:
  miniflare>sharp: 0.35.4
