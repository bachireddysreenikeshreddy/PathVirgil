name: Build PathVirgil Android APK

on:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      HARBOR_ANDROID_SERVER_ORIGIN: ${{ vars.HARBOR_APP_ORIGIN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install build tools and Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build and sign development APK
        shell: bash
        run: |
          set -euo pipefail
          export HARBOR_ANDROID_BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          export HARBOR_ANDROID_PLATFORM_JAR="$ANDROID_HOME/platforms/android-35/android.jar"
          python3 scripts/build-android.py
      - name: Save installable APK
        uses: actions/upload-artifact@v4
        with:
          name: PathVirgil-Android
          path: public/downloads/PathVirgil-Android.apk
          if-no-files-found: error
